<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Citizen Challenge - Team Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            color: white;
            user-select: none;
            overflow-x: hidden;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .btn-hover {
            transition: all 0.2s ease;
        }
        
        .btn-hover:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn-hover:active {
            transform: translateY(2px) scale(0.98);
        }

        .team1-active { border: 4px solid #f87171; background: rgba(248, 113, 113, 0.2); }
        .team2-active { border: 4px solid #34d399; background: rgba(52, 211, 153, 0.2); }
        .inactive-team { opacity: 0.5; filter: grayscale(50%); }

        input {
            background: rgba(255, 255, 255, 0.9);
            color: #1e3a8a;
        }
        input::placeholder {
            color: #94a3b8;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Top Scoreboard -->
    <header class="p-6 flex justify-between items-center hidden gap-4" id="game-header">
        <!-- Team 1 Score -->
        <div id="team1-board" class="flex-1 glass-panel p-4 rounded-2xl flex justify-between items-center transition-all duration-300">
            <h2 class="text-3xl font-bold text-red-300 drop-shadow-md" id="team1-display-name">Team 1</h2>
            <div class="text-4xl font-black bg-red-500 px-6 py-2 rounded-xl" id="team1-score">0</div>
        </div>

        <div class="text-4xl font-black text-yellow-300 px-4">VS</div>

        <!-- Team 2 Score -->
        <div id="team2-board" class="flex-1 glass-panel p-4 rounded-2xl flex justify-between items-center transition-all duration-300">
            <div class="text-4xl font-black bg-green-500 px-6 py-2 rounded-xl" id="team2-score">0</div>
            <h2 class="text-3xl font-bold text-green-300 drop-shadow-md" id="team2-display-name">Team 2</h2>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="flex-grow flex items-center justify-center p-8 w-full max-w-6xl mx-auto" id="main-container">
        <!-- Content injected here -->
    </main>

    <script>
        // --- GAME DATA ---
        const round1Data = [
            { text: "Melting polar ice caps causing sea levels to rise.", answer: "global", explanation: "This affects coastal cities worldwide and changes global weather patterns. It requires countries to work together!" },
            { text: "A large pothole on the street in front of our school.", answer: "local", explanation: "This only affects the people who drive on that specific street. The town council can fix this." },
            { text: "Plastic pollution accumulating in the oceans.", answer: "global", explanation: "Ocean currents carry plastic everywhere, affecting marine life globally across all borders." },
            { text: "The local library needs more funding for new books.", answer: "local", explanation: "This is super important, but it only impacts our specific town's residents." },
            { text: "A new virus spreading quickly across multiple continents.", answer: "global", explanation: "Pandemics cross borders easily and require the whole world to share medicine and information." },
            { text: "Debating whether to build a new park in your neighborhood.", answer: "local", explanation: "This decision is made by and for the local community to enjoy." },
            { text: "A shortage of computer microchips in Asia stopping the production of cars in your town.", answer: "global", explanation: "This is a Global Supply Chain issue! Countries rely on each other for parts and materials." },
            { text: "Your city council passing a new zoning law to allow taller apartment buildings.", answer: "local", explanation: "Even though housing is a big topic everywhere, the specific law and its immediate effects belong strictly to the local government." },
            { text: "Thousands of families fleeing their home country due to a severe, multi-year drought.", answer: "global", explanation: "This involves climate change and international borders. When people are forced to move (climate refugees), multiple nations must respond." },
            { text: "A viral social media trend spreading dangerous misinformation about a historical event.", answer: "global", explanation: "The internet has no borders! Digital information can instantly impact what millions of people around the world believe." }
        ];

        const round2Data = [
            {
                issue: "Deforestation in the Rainforest",
                quote: "\"I need to clear this small patch of land so I can plant crops and feed my family this year.\"",
                options: [
                    { text: "A Global Climate Scientist", correct: false },
                    { text: "A Local Farmer", correct: true },
                    { text: "A Wildlife Biologist", correct: false }
                ],
                explanation: "A local farmer's perspective focuses on immediate survival and food, which can sometimes conflict with long-term global environmental goals."
            },
            {
                issue: "Banning Single-Use Plastics",
                quote: "\"If we ban plastic bags, my factory will close and 100 people in our town will lose their jobs.\"",
                options: [
                    { text: "An Ocean Conservationist", correct: false },
                    { text: "A Marine Biologist", correct: false },
                    { text: "A Plastics Factory Owner", correct: true }
                ],
                explanation: "The factory owner is looking at the global issue of plastic from an economic and local employment perspective."
            },
            {
                issue: "Building a Huge New Wind Farm",
                quote: "\"The turbines are so loud and ruin the beautiful view from my living room window!\"",
                options: [
                    { text: "A Renewable Energy Engineer", correct: false },
                    { text: "A Local Resident Nearby", correct: true },
                    { text: "A Global Environmentalist", correct: false }
                ],
                explanation: "While wind energy helps the globe, a local resident might be more concerned about the immediate impact on their daily life."
            },
            {
                issue: "Global Water Scarcity",
                quote: "\"We need to build massive pipelines to bring water from other regions to our growing city, no matter what it costs them.\"",
                options: [
                    { text: "A City Mayor", correct: true },
                    { text: "An Ecologist (studies ecosystems)", correct: false },
                    { text: "A Farmer downstream", correct: false }
                ],
                explanation: "A mayor's perspective is focused entirely on providing resources for their own citizens, sometimes ignoring the perspective of people in other regions."
            },
            {
                issue: "Regulating the Fast Fashion Industry",
                quote: "\"My country relies on these clothing factories. If global brands leave because of strict new rules, millions of my people will fall into extreme poverty.\"",
                options: [
                    { text: "A Global Labor Rights Activist", correct: false },
                    { text: "A Minister of a Developing Nation", correct: true },
                    { text: "A Wealthy Fashion Designer", correct: false }
                ],
                explanation: "This highlights economic dependency. Even if factories have flaws, a government minister knows their local economy might crash if global businesses leave."
            },
            {
                issue: "Funding Mars Exploration",
                quote: "\"Why are we spending billions to find dead rocks in space when we haven't even mapped our own deep oceans or saved our dying coral reefs?\"",
                options: [
                    { text: "An Aerospace Engineer", correct: false },
                    { text: "A Marine Biologist", correct: true },
                    { text: "A Technology Billionaire", correct: false }
                ],
                explanation: "Different scientists have competing priorities. A marine biologist looks at the urgent crises on Earth, while an aerospace engineer looks to the future."
            },
            {
                issue: "The Rapid Growth of Artificial Intelligence",
                quote: "\"We must slow down this technology immediately. It doesn't matter how much more efficient businesses become if nobody has a job left to buy their products.\"",
                options: [
                    { text: "A Tech Company CEO", correct: false },
                    { text: "A Computer Science Professor", correct: false },
                    { text: "A Labor Union Leader", correct: true }
                ],
                explanation: "A labor leader's primary concern is protecting human workers and their livelihoods, looking past the 'efficiency' argument of business owners."
            },
            {
                issue: "Sharing Medical Patents During a Crisis",
                quote: "\"We spent ten years and billions of dollars inventing this medicine. If we are forced to give the recipe away for free, no company will ever invest in curing the next disease.\"",
                options: [
                    { text: "A World Health Organization Doctor", correct: false },
                    { text: "A Pharmaceutical Executive", correct: true },
                    { text: "A Patient in a Developing Country", correct: false }
                ],
                explanation: "While global doctors want free medicine for everyone, an executive is concerned about the financial incentive required to invent future medicines."
            }
        ];

        // Total 22 unique actions for 18 total questions to guarantee no repeats
        const masterSillyActions = [
            "🗣️ The person answering must speak in a fancy British accent!",
            "🥁 The whole team must do a 3-second drumroll on their desks before answering!",
            "🦩 The person answering must stand on one leg like a flamingo!",
            "🤫 The team must whisper their final answer to the teacher.",
            "🦸 The team must strike a superhero pose while giving the answer!",
            "🤖 The person answering must speak like a glitchy robot.",
            "🏊 The team must pretend to be swimming while thinking of the answer.",
            "🧐 The whole team must say 'Hmmm...' loudly while scratching their chins.",
            "🥶 The person answering must pretend they are freezing cold.",
            "🤠 Answer the question using your best cowboy/cowgirl voice!",
            "😎 Put on imaginary sunglasses before giving the answer.",
            "👻 The person answering must speak like a spooky ghost!",
            "🦖 Pretend to have tiny T-Rex arms while giving your answer!",
            "🎤 Use a marker or pencil as a microphone and interview the answerer.",
            "😴 The team must pretend to just wake up from a nap before answering.",
            "👽 Give the answer as an alien visiting Earth for the first time.",
            "😭 Answer the question while pretending to cry uncontrollably.",
            "🕺 The person answering must do a little victory dance first.",
            "🐭 Speak in the highest-pitched mouse squeak you can manage!",
            "🐢 Give the answer as slowly as a turtle moving through mud.",
            "😤 Say the answer like an incredibly grumpy old man.",
            "🧘‍♀️ Take a deep zen yoga breath together before answering."
        ];

        // --- GAME STATE ---
        let team1 = { name: "Team 1", score: 0 };
        let team2 = { name: "Team 2", score: 0 };
        let activeTeam = 1; // 1 or 2
        let currentRound = 1; 
        let currentQuestionIndex = 0;
        let currentSillyAction = "";
        let availableSillyActions = []; // Pool of remaining unique actions

        const mainContainer = document.getElementById('main-container');
        const header = document.getElementById('game-header');

        // --- RENDER FUNCTIONS ---

        function renderSetupScreen() {
            header.classList.add('hidden');
            mainContainer.innerHTML = `
                <div class="glass-panel p-12 rounded-3xl text-center max-w-4xl w-full pop-in">
                    <div class="text-7xl mb-6">🌍🏆🤝</div>
                    <h1 class="text-6xl font-black mb-8 text-yellow-300 drop-shadow-lg">Global Citizen Battle!</h1>
                    <p class="text-2xl mb-10 text-blue-100">Split the classroom into two teams. Let's see who knows more about our world!</p>
                    
                    <div class="flex gap-8 mb-10">
                        <div class="flex-1 bg-red-900/40 p-6 rounded-2xl border-2 border-red-400">
                            <h3 class="text-2xl font-bold text-red-300 mb-4">Team 1 Name</h3>
                            <input type="text" id="input-team1" placeholder="e.g., The Global Gladiators" class="w-full text-2xl p-4 rounded-xl font-bold text-center border-none focus:ring-4 focus:ring-red-400 outline-none" maxlength="20">
                        </div>
                        <div class="flex-1 bg-green-900/40 p-6 rounded-2xl border-2 border-green-400">
                            <h3 class="text-2xl font-bold text-green-300 mb-4">Team 2 Name</h3>
                            <input type="text" id="input-team2" placeholder="e.g., The Earth Defenders" class="w-full text-2xl p-4 rounded-xl font-bold text-center border-none focus:ring-4 focus:ring-green-400 outline-none" maxlength="20">
                        </div>
                    </div>

                    <button onclick="startGame()" class="bg-yellow-400 hover:bg-yellow-300 text-blue-900 text-4xl font-bold py-6 px-16 rounded-full btn-hover shadow-xl">
                        START THE BATTLE ⚔️
                    </button>
                </div>
            `;
        }

        function startGame() {
            const t1Input = document.getElementById('input-team1').value.trim();
            const t2Input = document.getElementById('input-team2').value.trim();
            
            team1.name = t1Input || "Team 1";
            team2.name = t2Input || "Team 2";
            team1.score = 0;
            team2.score = 0;
            activeTeam = 1;

            // Reset the pool of silly actions for a new game
            availableSillyActions = [...masterSillyActions];

            document.getElementById('team1-display-name').innerText = team1.name;
            document.getElementById('team2-display-name').innerText = team2.name;
            
            updateScoreboard();
            startRound1Intro();
        }

        // Logic to draw a UNIQUE silly action and remove it from the pool
        function getUniqueSillyAction() {
            if (availableSillyActions.length === 0) {
                // Safety fallback just in case we ever run out (though we have 22 for 18 questions)
                availableSillyActions = [...masterSillyActions];
            }
            const randomIndex = Math.floor(Math.random() * availableSillyActions.length);
            const selectedAction = availableSillyActions[randomIndex];
            
            // Remove the selected action so it cannot be chosen again
            availableSillyActions.splice(randomIndex, 1); 
            
            return selectedAction;
        }

        function updateScoreboard() {
            document.getElementById('team1-score').innerText = team1.score;
            document.getElementById('team2-score').innerText = team2.score;

            const t1Board = document.getElementById('team1-board');
            const t2Board = document.getElementById('team2-board');

            if (activeTeam === 1) {
                t1Board.classList.add('team1-active', 'scale-105');
                t1Board.classList.remove('inactive-team');
                t2Board.classList.add('inactive-team');
                t2Board.classList.remove('team2-active', 'scale-105');
            } else {
                t2Board.classList.add('team2-active', 'scale-105');
                t2Board.classList.remove('inactive-team');
                t1Board.classList.add('inactive-team');
                t1Board.classList.remove('team1-active', 'scale-105');
            }
        }

        function getActiveTeamData() {
            return activeTeam === 1 ? team1 : team2;
        }

        function startRound1Intro() {
            currentRound = 1;
            currentQuestionIndex = 0;
            header.classList.remove('hidden');
            updateScoreboard();
            
            mainContainer.innerHTML = `
                <div class="glass-panel p-12 rounded-3xl text-center max-w-4xl w-full pop-in border-4 border-yellow-300">
                    <h2 class="text-6xl font-black mb-6 text-yellow-300">Round 1: Global or Local?</h2>
                    <p class="text-3xl mb-8 leading-relaxed">Is the issue on the screen a <strong>Local Issue</strong> (affects one town) or a <strong>Global Issue</strong> (crosses borders)?</p>
                    <p class="text-2xl mb-10 text-orange-200 bg-orange-900/50 p-4 rounded-xl border border-orange-400">🤪 <strong>Watch out!</strong> Every turn will have a unique, random silly rule your team must follow while answering!</p>
                    <button onclick="renderRound1Question()" class="bg-blue-500 hover:bg-blue-400 text-white text-4xl font-bold py-6 px-16 rounded-full btn-hover shadow-xl">
                        Let's Go!
                    </button>
                </div>
            `;
        }

        function renderRound1Question() {
            if (currentQuestionIndex >= round1Data.length) {
                startRound2Intro();
                return;
            }

            updateScoreboard();
            const q = round1Data[currentQuestionIndex];
            const team = getActiveTeamData();
            const teamColor = activeTeam === 1 ? 'text-red-300' : 'text-green-300';
            
            currentSillyAction = getUniqueSillyAction();

            mainContainer.innerHTML = `
                <div class="w-full max-w-5xl pop-in">
                    
                    <!-- Turn Indicator -->
                    <div class="text-center mb-6">
                        <h2 class="text-5xl font-black ${teamColor} uppercase tracking-wider animate-pulse">
                            👉 It's ${team.name}'s Turn! 👈
                        </h2>
                    </div>

                    <!-- Silly Rule Card -->
                    <div class="bg-yellow-400 text-gray-900 p-4 rounded-2xl mb-8 transform -rotate-1 shadow-lg text-center border-4 border-white">
                        <span class="font-black text-xl uppercase tracking-widest text-yellow-900">🤪 Silly Rule For ${team.name}:</span>
                        <h3 class="text-3xl font-bold mt-2">${currentSillyAction}</h3>
                    </div>

                    <div class="glass-panel p-12 rounded-3xl text-center mb-10 border-t-8 ${activeTeam === 1 ? 'border-red-500' : 'border-green-500'}">
                        <div class="text-sm text-blue-200 font-bold uppercase tracking-widest mb-4">Question ${currentQuestionIndex + 1} of ${round1Data.length}</div>
                        <h2 class="text-5xl font-bold leading-tight text-white shadow-sm">${q.text}</h2>
                    </div>

                    <div class="flex gap-8 justify-center">
                        <button onclick="checkRound1Answer('local')" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-5xl font-bold py-10 rounded-2xl btn-hover shadow-2xl border-b-8 border-blue-800">
                            🏘️ Local Issue
                        </button>
                        <button onclick="checkRound1Answer('global')" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white text-5xl font-bold py-10 rounded-2xl btn-hover shadow-2xl border-b-8 border-purple-800">
                            🌍 Global Issue
                        </button>
                    </div>
                </div>
            `;
        }

        function checkRound1Answer(selected) {
            const q = round1Data[currentQuestionIndex];
            const isCorrect = selected === q.answer;
            handleAnswer(isCorrect, q.explanation, renderRound1Question);
        }

        function startRound2Intro() {
            currentRound = 2;
            currentQuestionIndex = 0;
            
            mainContainer.innerHTML = `
                <div class="glass-panel p-12 rounded-3xl text-center max-w-4xl w-full pop-in border-4 border-orange-400">
                    <h2 class="text-6xl font-black mb-6 text-orange-400">Round 2: Whose Perspective?</h2>
                    <p class="text-3xl mb-8 leading-relaxed">Global issues are complex! Read the quote and guess <strong>who is speaking</strong> based on their perspective.</p>
                    <p class="text-2xl mb-10 text-orange-200 bg-orange-900/50 p-4 rounded-xl border border-orange-400">The unique Silly Rules continue! Double points available in this round.</p>
                    <button onclick="renderRound2Question()" class="bg-orange-500 hover:bg-orange-400 text-white text-4xl font-bold py-6 px-16 rounded-full btn-hover shadow-xl">
                        Start Round 2
                    </button>
                </div>
            `;
        }

        function renderRound2Question() {
            if (currentQuestionIndex >= round2Data.length) {
                renderEndScreen();
                return;
            }

            updateScoreboard();
            const q = round2Data[currentQuestionIndex];
            const team = getActiveTeamData();
            const teamColor = activeTeam === 1 ? 'text-red-300' : 'text-green-300';
            
            currentSillyAction = getUniqueSillyAction();
            
            let optionsHTML = '';
            q.options.forEach((opt, index) => {
                optionsHTML += `
                    <button onclick="checkRound2Answer(${index})" class="w-full bg-indigo-700 hover:bg-indigo-600 text-white text-4xl font-bold py-6 px-8 rounded-xl btn-hover shadow-lg text-left border-l-8 border-indigo-400 mb-4 transition-colors">
                        ${['A', 'B', 'C'][index]}. ${opt.text}
                    </button>
                `;
            });

            mainContainer.innerHTML = `
                <div class="w-full max-w-5xl pop-in">
                    
                    <!-- Turn Indicator -->
                    <div class="text-center mb-6">
                        <h2 class="text-5xl font-black ${teamColor} uppercase tracking-wider animate-pulse">
                            👉 It's ${team.name}'s Turn! 👈
                        </h2>
                    </div>

                    <!-- Silly Rule Card -->
                    <div class="bg-yellow-400 text-gray-900 p-4 rounded-2xl mb-8 transform rotate-1 shadow-lg text-center border-4 border-white">
                        <span class="font-black text-xl uppercase tracking-widest text-yellow-900">🤪 Silly Rule For ${team.name}:</span>
                        <h3 class="text-3xl font-bold mt-2">${currentSillyAction}</h3>
                    </div>

                    <div class="glass-panel p-8 rounded-3xl mb-8 relative border-t-8 ${activeTeam === 1 ? 'border-red-500' : 'border-green-500'}">
                        <div class="absolute -top-6 left-8 bg-orange-500 text-white px-6 py-2 rounded-lg font-black text-xl uppercase tracking-wider shadow-md">
                            Issue: ${q.issue}
                        </div>
                        <h2 class="text-4xl font-bold leading-tight mt-8 italic text-yellow-100">
                            "${q.quote}"
                        </h2>
                    </div>

                    <div class="flex flex-col gap-2">
                        ${optionsHTML}
                    </div>
                </div>
            `;
        }

        function checkRound2Answer(selectedIndex) {
            const q = round2Data[currentQuestionIndex];
            const isCorrect = q.options[selectedIndex].correct;
            const correctAnswerText = q.options.find(o => o.correct).text;
            const explanationText = `<strong>It was: ${correctAnswerText}</strong><br><br>${q.explanation}`;
            
            handleAnswer(isCorrect, explanationText, renderRound2Question);
        }

        // Handles scoring, feedback, and turn switching
        function handleAnswer(isCorrect, explanation, nextFunction) {
            const team = getActiveTeamData();
            const pointsToAward = currentRound === 1 ? 100 : 200; // R2 is worth more

            let feedbackTitle = "";
            let colorClass = "";
            let titleColor = "";

            if (isCorrect) {
                if (activeTeam === 1) team1.score += pointsToAward;
                else team2.score += pointsToAward;
                
                feedbackTitle = `🎉 YES! +${pointsToAward} to ${team.name}!`;
                colorClass = 'bg-green-600';
                titleColor = 'text-green-100';
            } else {
                feedbackTitle = `❌ Oh no! No points for ${team.name}!`;
                colorClass = 'bg-red-600';
                titleColor = 'text-red-100';
            }

            updateScoreboard();

            mainContainer.innerHTML = `
                <div class="${colorClass} p-12 rounded-3xl text-center max-w-4xl w-full pop-in shadow-2xl border-4 border-white">
                    <h2 class="text-5xl font-black mb-8 ${titleColor}">${feedbackTitle}</h2>
                    <div class="bg-black/20 p-8 rounded-2xl mb-10">
                        <p class="text-3xl leading-relaxed text-white drop-shadow-md">
                            ${explanation}
                        </p>
                    </div>
                    <button id="next-btn" class="bg-white text-gray-900 text-4xl font-bold py-6 px-16 rounded-full btn-hover shadow-xl">
                        Next Turn ➔
                    </button>
                </div>
            `;

            // Switch turn for the next question
            activeTeam = activeTeam === 1 ? 2 : 1;
            currentQuestionIndex++;

            document.getElementById('next-btn').onclick = nextFunction;
        }

        function renderEndScreen() {
            header.classList.add('hidden');
            
            let winnerText = "";
            let subText = "";
            
            if (team1.score > team2.score) {
                winnerText = `🏆 ${team1.name} Wins! 🏆`;
                subText = `${team2.name} put up a great fight!`;
            } else if (team2.score > team1.score) {
                winnerText = `🏆 ${team2.name} Wins! 🏆`;
                subText = `${team1.name} put up a great fight!`;
            } else {
                winnerText = `🤝 It's a TIE! 🤝`;
                subText = `Both teams are ultimate Global Citizens!`;
            }

            mainContainer.innerHTML = `
                <div class="glass-panel p-12 rounded-3xl text-center max-w-4xl w-full pop-in relative overflow-hidden">
                    <h1 class="text-6xl font-black mb-8 text-yellow-300 drop-shadow-lg">${winnerText}</h1>
                    <p class="text-3xl text-blue-200 mb-12">${subText}</p>
                    
                    <div class="flex justify-center gap-12 mb-12">
                        <div class="text-center bg-red-900/50 p-8 rounded-2xl border-4 border-red-500 min-w-[250px]">
                            <h3 class="text-2xl text-red-300 font-bold mb-2">${team1.name}</h3>
                            <div class="text-6xl font-black text-white">${team1.score}</div>
                        </div>
                        <div class="text-center bg-green-900/50 p-8 rounded-2xl border-4 border-green-500 min-w-[250px]">
                            <h3 class="text-2xl text-green-300 font-bold mb-2">${team2.name}</h3>
                            <div class="text-6xl font-black text-white">${team2.score}</div>
                        </div>
                    </div>
                    
                    <button onclick="renderSetupScreen()" class="bg-blue-500 hover:bg-blue-400 text-white text-3xl font-bold py-4 px-10 rounded-full btn-hover shadow-xl">
                        Play Again
                    </button>
                </div>
            `;
        }

        // Initialize game on load
        window.onload = renderSetupScreen;

    </script>
</body>
</html>
